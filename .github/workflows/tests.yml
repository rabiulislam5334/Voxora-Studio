name: Voxora tests

on:
  push:
    branches:
      - main
      - ci/windows-tests
      - dev/step-3-and-5-2
      - repair/persistence-pr1-main-sync
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest-ubuntu:
    name: pytest (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -vv -o faulthandler_timeout=180 --durations=30 tests

  pytest-windows:
    name: pytest (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and FFprobe
        run: choco install ffmpeg --yes --no-progress
        shell: pwsh
      - name: Verify FFmpeg and FFprobe
        run: |
          Get-Command ffmpeg
          Get-Command ffprobe
          ffmpeg -version
          ffprobe -version
        shell: pwsh
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -vv -o faulthandler_timeout=180 --durations=30 tests
