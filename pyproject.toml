[project]
name = "ai-youtube-voice-studio"
version = "0.1.0"
description = "Desktop AI voice production studio for YouTube narration (Bengali + English)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "edge-tts>=6.1.9",
    "pygame>=2.6.1",
    "mutagen>=1.47.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"